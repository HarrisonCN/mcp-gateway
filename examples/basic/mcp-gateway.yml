# Basic mcp-gateway configuration
# Manages two MCP servers: filesystem and GitHub

version: 10
port: 4000
# Loopback only: this example has no auth. Use 0.0.0.0 only together with auth (10.3 refuses otherwise).
host: 127.0.0.1
logLevel: info

monitor:
  requestLog: true
  prometheus: false
  retentionHours: 24

servers:
  - id: filesystem
    name: Filesystem Server
    description: Read and write local files
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
    tags: [files, local]
    enabled: true
    timeoutMs: 15000

  - id: github
    name: GitHub Server
    description: Interact with GitHub repositories and issues
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"
    tags: [github, vcs]
    enabled: true
    timeoutMs: 30000
