# Plain Kubernetes manifests (docs/deployment.md#kubernetes). Apply with:
#   kubectl create secret generic mcp-gateway --from-literal=MCP_GATEWAY_API_KEYS=$(openssl rand -hex 24)
#   kubectl apply -f examples/deploy/kubernetes/mcp-gateway.yaml
# The Secret below is only a placeholder for local clusters — create a real one as above (or with sealed / external
# secrets) and delete this document. Pin a release in production: ghcr.io/harrisoncn/mcp-gateway:14.9.2 or @sha256:<digest>.
apiVersion: v1
kind: Secret
metadata:
  name: mcp-gateway
type: Opaque
stringData:
  MCP_GATEWAY_API_KEYS: change-me-to-a-long-random-key
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-gateway
data:
  mcp-gateway.yml: |
    # Gateway config for the Compose / Kubernetes / Helm deployment examples (config schema v11).
    # API keys are NOT here: they come from MCP_GATEWAY_API_KEYS (Compose environment, Kubernetes Secret).
    version: 12
    logLevel: info
    monitor:
      prometheus: true
    servers:
      - id: echo
        name: Echo (example stdio server)
        transport: stdio
        command: node
        args: ["/config/echo-server.mjs"]
  echo-server.mjs: |
    // Minimal MCP stdio server used by the deployment examples (one `echo` tool). Replace it with your own servers.
    import readline from 'node:readline';
    const rl = readline.createInterface({ input: process.stdin });
    rl.on('line', (line) => {
      const m = JSON.parse(line);
      if (m.id === undefined) return;
      const result =
        m.method === 'initialize'
          ? { protocolVersion: m.params.protocolVersion, capabilities: { tools: {} }, serverInfo: { name: 'echo', version: '1.0.0' } }
          : m.method === 'tools/list'
            ? { tools: [{ name: 'echo', description: 'Echo the arguments back', inputSchema: { type: 'object' } }] }
            : m.method === 'tools/call'
              ? { content: [{ type: 'text', text: JSON.stringify(m.params.arguments ?? {}) }] }
              : {};
      process.stdout.write(JSON.stringify({ jsonrpc: '2.0', id: m.id, result }) + '\n');
    });
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  labels: { app: mcp-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-gateway }
  template:
    metadata:
      labels: { app: mcp-gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: /metrics
    spec:
      # no service-link env vars: the Service below would otherwise inject MCP_GATEWAY_PORT=tcp://…
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mcp-gateway
          image: ghcr.io/harrisoncn/mcp-gateway:14
          imagePullPolicy: IfNotPresent
          args: ["start", "-c", "/config/mcp-gateway.yml", "--no-watch"]
          ports:
            - { name: http, containerPort: 4000 }
          envFrom:
            - secretRef: { name: mcp-gateway }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: data, mountPath: /app/data }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap: { name: mcp-gateway }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway
spec:
  selector: { app: mcp-gateway }
  ports:
    - { name: http, port: 80, targetPort: http }
