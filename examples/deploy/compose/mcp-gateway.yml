# Gateway config for the Compose / Kubernetes / Helm deployment examples (config schema v11).
# API keys are NOT here: they come from MCP_GATEWAY_API_KEYS (Compose environment, Kubernetes Secret).
version: 12
logLevel: info
monitor:
  prometheus: true
servers:
  - id: echo
    name: Echo (example stdio server)
    transport: stdio
    command: node
    args: ["/app/examples/echo-server.mjs"]
