# Config mounted by examples/docker/docker-compose.yml
# API keys come from MCP_GATEWAY_API_KEYS (set via GATEWAY_API_KEY in compose).

port: 4000
host: 0.0.0.0
logLevel: info

auth:
  strategy: api-key
  apiKeys: ["overridden-by-MCP_GATEWAY_API_KEYS"]
  protect:
    health: false
    metrics: true      # Prometheus authenticates with the same key (see prometheus.yml)

monitor:
  prometheus: true
  requestLog: true

reconnect:
  initialDelayMs: 1000
  maxDelayMs: 30000

servers:
  - id: filesystem
    name: Filesystem
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
    tags: [files]

  - id: postgres
    name: PostgreSQL
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-postgres", "${DATABASE_URL}"]
    tags: [database]
