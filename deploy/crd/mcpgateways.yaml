# McpGateway CRD (6.8). Install before the operator: kubectl apply -f deploy/crd/mcpgateways.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpgateways.mcp-gateway.dev
spec:
  group: mcp-gateway.dev
  scope: Namespaced
  names:
    plural: mcpgateways
    singular: mcpgateway
    kind: McpGateway
    shortNames:
      - mgw
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
