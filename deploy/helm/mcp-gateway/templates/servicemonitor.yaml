{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "mcp-gateway.fullname" . }}
  labels: {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "mcp-gateway.selectorLabels" . | nindent 6 }}
  endpoints:
    - { port: http, path: /api/v1/metrics, interval: {{ .Values.serviceMonitor.interval }} }
{{- end }}
