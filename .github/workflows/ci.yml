name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      redis:
        # Mirror of Docker Hub's official image (same tag): unauthenticated Docker Hub pulls hit 429 rate limits
        image: public.ecr.aws/docker/library/redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Enables the real-Redis tests in test/state.test.ts
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Dependency audit (blocking on high / critical)
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Test with coverage (fails below thresholds in vitest.config.ts)
        run: npm run test:coverage
      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Coverage (Node ${{ matrix.node }})", "", "| Metric | % | Covered |", "|---|---|---|",
              ...["statements", "branches", "functions", "lines"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: npm run build
      - name: CLI smoke test
        run: |
          node dist/cli.js --version
          node dist/cli.js init -o /tmp/mcp-gateway.yml
          node dist/cli.js validate -c /tmp/mcp-gateway.yml --strict
      - name: Validate examples (--strict fails on security warnings)
        run: |
          for f in examples/*/mcp-gateway.yml; do
            echo "::group::$f"
            (cd "$(dirname "$f")" && node "$GITHUB_WORKSPACE/dist/cli.js" validate -c mcp-gateway.yml --strict)
            echo "::endgroup::"
          done
      - name: Package contents
        run: npm pack --dry-run
      - name: Kernel benchmark (startup time, memory, evaluated feature modules vs bench/baseline.json)
        run: node bench/kernel.mjs --runs 5 --compare bench/baseline.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: matrix.node == 22 && always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  supply-chain:
    name: Supply chain (Trivy, SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Trivy — dependencies and lockfiles (blocking on fixable high / critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: node_modules,clients/js/node_modules,dist
      - uses: docker/setup-buildx-action@v4
        with:
          # BuildKit from the ECR Public mirror (Docker Hub unauthenticated pulls are rate limited)
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1
      - name: Build the container image (linux/amd64, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: mcp-gateway:ci
          cache-from: type=gha
      - name: Trivy — container image (blocking on fixable critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: mcp-gateway:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy — container image high findings (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: mcp-gateway:ci
          severity: HIGH
          ignore-unfixed: true
          exit-code: '0'
          skip-setup-trivy: true
      - name: Image smoke test (refuses to start without auth, starts with a key)
        run: |
          if docker run --rm mcp-gateway:ci start; then echo "::error::started without auth"; exit 1; fi
          docker run -d --name gw -p 4000:4000 -e MCP_GATEWAY_API_KEYS=ci-key mcp-gateway:ci start
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4000/api/v1/health/live && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/api/v1/tools)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-key' http://127.0.0.1:4000/api/v1/tools)" = 200
          docker rm -f gw
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: SBOM (CycloneDX + SPDX) for the npm package
        run: |
          npm ci --ignore-scripts
          npm sbom --omit dev --sbom-format cyclonedx > sbom.cdx.json
          npm sbom --omit dev --sbom-format spdx > sbom.spdx.json
          node -e 'const b=require("./sbom.cdx.json"); if(b.bomFormat!=="CycloneDX"||!b.components?.length) process.exit(1); console.log(b.components.length+" components")'

  js-client:
    name: JS client (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: clients/js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: clients/js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package contents
        run: npm pack --dry-run

  kotlin-client:
    name: Kotlin client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/kotlin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test build --no-daemon
