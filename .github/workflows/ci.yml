name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      redis:
        # Mirror of Docker Hub's official image (same tag): unauthenticated Docker Hub pulls hit 429 rate limits
        image: public.ecr.aws/docker/library/redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Enables the real-Redis tests in test/state.test.ts
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Dependency audit (blocking on high / critical)
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Test with coverage (fails below thresholds in vitest.config.ts)
        run: npm run test:coverage
      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Coverage (Node ${{ matrix.node }})", "", "| Metric | % | Covered |", "|---|---|---|",
              ...["statements", "branches", "functions", "lines"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: npm run build
      - name: CLI smoke test
        run: |
          node dist/cli.js --version
          node dist/cli.js init -o /tmp/mcp-gateway.yml
          node dist/cli.js validate -c /tmp/mcp-gateway.yml --strict
      - name: Validate examples (--strict fails on security warnings)
        run: |
          for f in examples/*/mcp-gateway.yml; do
            echo "::group::$f"
            (cd "$(dirname "$f")" && node "$GITHUB_WORKSPACE/dist/cli.js" validate -c mcp-gateway.yml --strict)
            echo "::endgroup::"
          done
      - name: Package contents
        run: npm pack --dry-run
      - name: Kernel benchmark (startup time, memory, evaluated feature modules vs bench/baseline.json)
        # pipefail: the gross-regression / module-count guard must not be masked by tee. Baselines are per platform
        # (bench/baseline.json `platforms`); memory is only report-only on a platform with no recorded baseline.
        run: |
          set -o pipefail
          node bench/kernel.mjs --runs 5 --compare bench/baseline.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: matrix.node == 22 && always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  docs:
    name: Docs check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Docs auto-check (config snippets vs schema v11, CLI flags, links, image tags, versions)
        run: npx tsx scripts/docs-check.ts

  supply-chain:
    name: Supply chain (Trivy, SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Trivy — dependencies and lockfiles (blocking on fixable high / critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: node_modules,clients/js/node_modules,dist
      - uses: docker/setup-buildx-action@v4
        id: buildx-ecr
        # 15.0.0-rc.4: ECR Public answers anonymous pulls with `toomanyrequests: Rate exceeded` now and then (#219, #224,
        # #226 failed on it). One registry being throttled must not fail a PR: fall back to Docker Hub.
        continue-on-error: true
        with:
          # BuildKit from the ECR Public mirror (Docker Hub unauthenticated pulls are rate limited)
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1
      - uses: docker/setup-buildx-action@v4
        if: steps.buildx-ecr.outcome == 'failure'
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1
      - name: Build the container image (linux/amd64, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: mcp-gateway:ci
          cache-from: type=gha
      - name: Trivy — container image (blocking on fixable critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: mcp-gateway:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy — container image high findings (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: mcp-gateway:ci
          severity: HIGH
          ignore-unfixed: true
          exit-code: '0'
          skip-setup-trivy: true
      - name: Image smoke test (refuses to start without auth, starts with a key)
        run: |
          if docker run --rm mcp-gateway:ci start; then echo "::error::started without auth"; exit 1; fi
          docker run -d --name gw -p 4000:4000 -e MCP_GATEWAY_API_KEYS=ci-key mcp-gateway:ci start
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4000/api/v1/health/live && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/api/v1/tools)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-key' http://127.0.0.1:4000/api/v1/tools)" = 200
          docker rm -f gw
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: SBOM (CycloneDX + SPDX) for the npm package
        run: |
          npm ci --ignore-scripts
          npm sbom --omit dev --sbom-format cyclonedx > sbom.cdx.json
          npm sbom --omit dev --sbom-format spdx > sbom.spdx.json
          node -e 'const b=require("./sbom.cdx.json"); if(b.bomFormat!=="CycloneDX"||!b.components?.length) process.exit(1); console.log(b.components.length+" components")'

  compat-matrix:
    name: MCP compat matrix
    # 13.6.0: official TypeScript SDK client x every downstream revision, official Python SDK client, upstream stdio /
    # Streamable HTTP / legacy SSE, and the gateway -> Motionary MCP E2E (Motionary installed here only, never a dependency).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MCP_PY_VERSION: '2.3.0'
      MOTIONARY_VERSION: '14.8.0'
      MOTIONARY_EXPECT_TOOLS: 'get_example,scaffold_snippet,suggest_motion,validate_snippet,check_compat,check_compatibility,suggest_fix'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Python SDK (official "mcp" package, pinned)
        run: |
          python -m venv /tmp/mcpvenv
          /tmp/mcpvenv/bin/pip install --quiet "mcp==${MCP_PY_VERSION}"
          /tmp/mcpvenv/bin/python -c "import mcp, importlib.metadata as m; print('mcp', m.version('mcp'))"
      - name: Motionary MCP server from npm (scratch dir, not package.json)
        run: |
          mkdir -p /tmp/motionary && cd /tmp/motionary
          npm init -y >/dev/null
          npm i --no-audit --no-fund "motionary@${MOTIONARY_VERSION}"
          test -f node_modules/motionary/bin/motionary-mcp.mjs
      - name: Compatibility matrix + Motionary E2E
        env:
          MGW_PY_MCP: /tmp/mcpvenv/bin/python
          MGW_MOTIONARY_BIN: /tmp/motionary/node_modules/motionary/bin/motionary-mcp.mjs
          MGW_COMPAT_REPORT: compat-matrix.json
        run: |
          npx vitest run test/compat-matrix-13-6-0.test.ts test/motionary-e2e.test.ts test/motionary-schemas-15-3-1.test.ts test/protocol-compat.test.ts
          cat compat-matrix.json
      - name: Fail if a client was skipped
        run: node -e "const r=require('./compat-matrix.json'); const k=Object.keys(r); if(!k.some(x=>x.startsWith('py-sdk@'))||k.filter(x=>x.startsWith('ts-sdk@')).length<3){console.error('matrix incomplete', k); process.exit(1)}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: compat-matrix
          path: compat-matrix.json
          if-no-files-found: ignore

  multi-instance:
    name: Multi-instance reliability (real Redis)
    # 13.7.0: real redis-server processes (crash + restart, AUTH + SELECT) behind an in-test TCP fault proxy (latency,
    # stalls, resets, partitions) and several gateway instances sharing them: session recovery / termination,
    # revocation and rate-limit consistency, connection migration. The suite skips without redis-server, so this job
    # installs it and fails if the suite did not run.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: redis-server
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q redis-server
          sudo systemctl stop redis-server || true
          redis-server --version
      - name: Multi-instance + Redis fault-injection suite
        run: |
          npx vitest run test/multi-instance-13-7-0.test.ts test/state.test.ts --reporter=default --reporter=json --outputFile.json=multi-instance.json
          node -e "const r=require('./multi-instance.json'); const s=r.testResults.flatMap(f=>f.assertionResults).filter(a=>a.status==='skipped'||a.status==='pending'); const n=r.numPassedTests; console.log(n+' passed'); if(r.numFailedTests||n<13){process.exit(1)}"

  rc-validation:
    name: Upgrade + security regressions (real Redis)
    # 14.9.0: v15 release-candidate validation that needs real infrastructure: upgrade / rollback from the published
    # 13.9.5 and 14.8.0 packages on SQLite and a real redis-server (scripts/upgrade-test.sh), the consolidated security
    # regression suite (its Redis cases run here) and the fuzz runs at FC_RUNS=1000.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: redis-server
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q redis-server
          sudo systemctl stop redis-server || true
          redis-server --version
      - name: Upgrade / rollback (13.9.5, 14.8.0 → this commit)
        run: bash scripts/upgrade-test.sh 13.9.5 14.8.0
      - name: Security regressions, cross-tenant matrix, fuzz
        env:
          FC_RUNS: '1000'
        run: npx vitest run test/security-regressions-14-9-0.test.ts test/cross-tenant-matrix-14-9-0.test.ts test/fuzz-14-9-0.test.ts

  js-client:
    name: JS client (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: clients/js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: clients/js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package contents
        run: npm pack --dry-run

  kotlin-client:
    name: Kotlin client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/kotlin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test build --no-daemon
