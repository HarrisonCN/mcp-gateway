name: Dashboard demo (GitHub Pages)

# Publishes the dashboard with an in-browser simulated backend
# (dashboard/demo/mock.js) to GitHub Pages. No gateway runs; all data is
# generated in the visitor's browser.
# Requires Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: [dashboard/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Assemble _site
        run: |
          mkdir -p _site
          cp dashboard/demo/mock.js _site/demo.js
          # Load the simulated backend before the dashboard script.
          awk 'BEGIN{d=0} /^<script>/ && !d {print "<script src=\"demo.js\"></script>"; d=1} {print}' dashboard/index.html > _site/index.html
          grep -q 'src="demo.js"' _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
