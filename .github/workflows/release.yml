name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: SBOM (CycloneDX + SPDX, production dependencies)
        run: |
          V="${{ github.event.release.tag_name }}"
          npm sbom --omit dev --sbom-format cyclonedx > "mcp-gateway-${V#v}.cdx.json"
          npm sbom --omit dev --sbom-format spdx > "mcp-gateway-${V#v}.spdx.json"
          sha256sum ./*.tgz ./*.cdx.json ./*.spdx.json > SHA256SUMS
      - name: Upload package, SBOMs and checksums to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ./*.tgz ./*.cdx.json ./*.spdx.json SHA256SUMS --clobber
