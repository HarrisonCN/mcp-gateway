name: Docker image

# Builds and pushes ghcr.io/<owner>/mcp-gateway when a GitHub release is published.
# Tags: <version>, <major>.<minor>, <major>, latest (15.0.0-rc.1: a prerelease gets <version> only).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v1.0.0)
        required: true

permissions:
  contents: read
  packages: write
  id-token: write          # cosign keyless signing (Sigstore Fulcio certificate from the workflow's OIDC token)
  security-events: write   # upload the Trivy report to code scanning

concurrency:
  group: docker-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      # QEMU (binfmt) and BuildKit images: ECR Public mirror first (Docker Hub unauthenticated pulls are
      # rate limited), Docker Hub second, then ECR Public once more after a pause. ECR Public also answers
      # `toomanyrequests` for anonymous pulls; one registry being throttled must not fail a release.
      - id: qemu
        uses: docker/setup-qemu-action@v4
        continue-on-error: true
        with:
          image: public.ecr.aws/vend/tonistiigi/binfmt:latest
      - id: qemu_hub
        if: steps.qemu.outcome == 'failure'
        uses: docker/setup-qemu-action@v4
        continue-on-error: true
        with:
          image: docker.io/tonistiigi/binfmt:latest
      - name: Wait before the last binfmt attempt
        if: steps.qemu.outcome == 'failure' && steps.qemu_hub.outcome == 'failure'
        run: sleep 90
      - if: steps.qemu.outcome == 'failure' && steps.qemu_hub.outcome == 'failure'
        uses: docker/setup-qemu-action@v4
        with:
          image: public.ecr.aws/vend/tonistiigi/binfmt:latest

      - id: buildx
        uses: docker/setup-buildx-action@v4
        continue-on-error: true
        with:
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1
      - id: buildx_hub
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v4
        continue-on-error: true
        with:
          driver-opts: image=docker.io/moby/buildkit:buildx-stable-1
      - name: Wait before the last BuildKit attempt
        if: steps.buildx.outcome == 'failure' && steps.buildx_hub.outcome == 'failure'
        run: sleep 90
      - if: steps.buildx.outcome == 'failure' && steps.buildx_hub.outcome == 'failure'
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # ghcr.io image names must be lowercase
          images: ghcr.io/${{ github.repository_owner }}/mcp-gateway
          flavor: |
            latest=${{ github.event.release.prerelease != true }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name || inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name || inputs.tag }},enable=${{ github.event.release.prerelease != true }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name || inputs.tag }},enable=${{ github.event.release.prerelease != true }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign the image (cosign keyless, by digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/mcp-gateway
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/mcp-gateway
        run: |
          cosign verify "${IMAGE,,}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/docker.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signature verified for ${IMAGE,,}@${DIGEST}"

      - name: Image reference (lowercase — registry references must be)
        id: ref
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/mcp-gateway
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=${IMAGE,,}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Trivy scan of the published image (report to code scanning)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ref.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
