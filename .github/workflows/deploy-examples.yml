name: Deployment examples

# Boots every example in examples/deploy (referenced by docs/deployment.md): Docker Compose with the published image
# the example names and with an image built from this commit, then the plain Kubernetes manifests and the Helm chart
# on a kind cluster. Release gate: conditional checks (scripts/required-checks.json).
on:
  push:
    branches: [main]
    paths: ['examples/deploy/**', 'docs/deployment.md', 'deploy/**', 'Dockerfile', 'src/**', 'package-lock.json', '.github/workflows/deploy-examples.yml']
  pull_request:
    paths: ['examples/deploy/**', 'docs/deployment.md', 'deploy/**', 'Dockerfile', 'src/**', 'package-lock.json', '.github/workflows/deploy-examples.yml']

permissions:
  contents: read

concurrency:
  group: deploy-examples-${{ github.ref }}
  cancel-in-progress: true

env:
  KEY: ci-deploy-example-key-0123456789abcdef

jobs:
  compose:
    name: Compose example boots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the image from this commit
        # 15.3: public.ecr.aws answers 429 "Data limit exceeded" under load — retry once, then fall back to the same
        # official image on Docker Hub (identical tags; the Dockerfile's NODE_IMAGE build arg)
        run: |
          docker build -t mcp-gateway:ci . || { sleep 20; docker build -t mcp-gateway:ci .; } \
            || docker build --build-arg NODE_IMAGE=docker.io/library/node:22-alpine -t mcp-gateway:ci .
      - name: The image HEALTHCHECK reports healthy
        run: |
          docker run -d --name hc -e MCP_GATEWAY_API_KEYS="$KEY" mcp-gateway:ci start
          for i in $(seq 1 45); do
            s=$(docker inspect --format '{{.State.Health.Status}}' hc); [ "$s" = healthy ] && break; sleep 2
          done
          docker inspect --format '{{json .State.Health}}' hc
          test "$(docker inspect --format '{{.State.Health.Status}}' hc)" = healthy
          docker rm -f hc
      - name: Boot the Compose example (published image it names, then this commit's image)
        working-directory: examples/deploy/compose
        run: |
          set -euo pipefail
          check() {
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4000/api/v1/health/ready >/dev/null && break; sleep 2; done
            curl -fsS -H "Authorization: Bearer $KEY" http://127.0.0.1:4000/api/v1/tools | grep -q '"echo"'
            curl -fsS -X POST -H "Authorization: Bearer $KEY" -H 'content-type: application/json' \
              -d '{"server":"echo","tool":"echo","arguments":{"hello":"compose"}}' http://127.0.0.1:4000/api/v1/tools/call | grep -q compose
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/api/v1/tools)" = 401
          }
          export GATEWAY_API_KEY="$KEY"
          fail() { docker compose ps; docker compose logs; docker inspect --format '{{json .State.Health}}' "$(docker compose ps -q mcp-gateway)" || true; exit 1; }
          for image in "" mcp-gateway:ci; do
            echo "::group::compose up (${image:-default image})"
            export MGW_IMAGE="$image"
            if [ -z "$image" ] && ! docker compose pull -q mcp-gateway; then
              # a new major's PR names its image tag (e.g. :14) before that tag is first published
              echo "::notice::the published image the example names is not available yet (new major before its release) — booting this commit's image only"
              echo "::endgroup::"; continue
            fi
            docker compose up -d --wait --wait-timeout 120 || fail
            check || fail
            docker compose down -v
            echo "::endgroup::"
          done

  kind:
    name: Kubernetes and Helm examples boot (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Build the image from this commit
        # 15.3: public.ecr.aws answers 429 "Data limit exceeded" under load — retry once, then fall back to the same
        # official image on Docker Hub (identical tags; the Dockerfile's NODE_IMAGE build arg)
        run: |
          docker build -t mcp-gateway:ci . || { sleep 20; docker build -t mcp-gateway:ci .; } \
            || docker build --build-arg NODE_IMAGE=docker.io/library/node:22-alpine -t mcp-gateway:ci .
      - name: Create a kind cluster (with retries, the node image comes from Docker Hub)
        run: |
          set -euo pipefail
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64 && chmod +x kind && sudo mv kind /usr/local/bin/kind
          for i in 1 2 3; do kind create cluster --wait 120s && break; echo "retry $i"; kind delete cluster || true; sleep 20; done
          kubectl get nodes
          kind load docker-image mcp-gateway:ci
      - name: Plain manifests (examples/deploy/kubernetes)
        run: |
          set -euo pipefail
          kubectl create namespace plain
          sed -E 's#ghcr.io/harrisoncn/mcp-gateway:[0-9][0-9.]*#mcp-gateway:ci#' examples/deploy/kubernetes/mcp-gateway.yaml \
            | sed "s#change-me-to-a-long-random-key#$KEY#" | kubectl -n plain apply -f -
          kubectl -n plain rollout status deployment/mcp-gateway --timeout=180s || { kubectl -n plain describe pods; kubectl -n plain logs deploy/mcp-gateway; exit 1; }
          kubectl -n plain port-forward svc/mcp-gateway 18080:80 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/api/v1/health/ready >/dev/null && break; sleep 1; done
          curl -fsS -X POST -H "Authorization: Bearer $KEY" -H 'content-type: application/json' \
            -d '{"server":"echo","tool":"echo","arguments":{"hello":"k8s"}}' http://127.0.0.1:18080/api/v1/tools/call | grep -q k8s
      - name: Helm chart with examples/deploy/helm/values.yaml
        run: |
          set -euo pipefail
          helm lint --strict deploy/helm/mcp-gateway -f examples/deploy/helm/values.yaml
          kubectl create namespace helm
          kubectl -n helm create secret generic gw-secrets --from-literal=MCP_GATEWAY_API_KEYS="$KEY"
          helm install gw deploy/helm/mcp-gateway -n helm -f examples/deploy/helm/values.yaml \
            --set image.repository=mcp-gateway --set image.tag=ci --wait --timeout 180s \
            || { kubectl -n helm describe pods; kubectl -n helm logs deploy/gw-mcp-gateway; exit 1; }
          kubectl -n helm port-forward svc/gw-mcp-gateway 18081:80 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18081/api/v1/health/ready >/dev/null && break; sleep 1; done
          curl -fsS -X POST -H "Authorization: Bearer $KEY" -H 'content-type: application/json' \
            -d '{"server":"echo","tool":"echo","arguments":{"hello":"helm"}}' http://127.0.0.1:18081/api/v1/tools/call | grep -q helm
