version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    commit-message: { prefix: "chore(deps)" }
    # Majors are adopted deliberately (they have broken CI: zod 4, vitest 5, Gradle 9, OkHttp 5, …).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /clients/js
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    commit-message: { prefix: "chore(deps-js-client)" }
    # Majors are adopted deliberately (they have broken CI: zod 4, vitest 5, Gradle 9, OkHttp 5, …).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /clients/kotlin
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps-kotlin-client)" }
    # Majors are adopted deliberately (they have broken CI: zod 4, vitest 5, Gradle 9, OkHttp 5, …).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: "ci" }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(docker)" }
    # Stay on the Node 22 LTS base image (node:sqlite audit log, documented runtime); bump majors by hand.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /clients/python
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps-python-client)" }

  - package-ecosystem: gomod
    directory: /clients/go
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps-go-client)" }
